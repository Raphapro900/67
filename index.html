<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>676767676767676767SIXSEVEN6767676767676767676767SEISSIETE6767676776767676767676767676767676767676767</title>
  <style>
    body {
      margin: 0;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #000;
      flex-direction: column;
      overflow: hidden;
      font-family: sans-serif;
    }

    /* Intro video */
    #introVideo {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      z-index: 100;
      background: #000;
    }

    /* Overlay para indicar que hay que hacer clic */
    #clickOverlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 110;
      background: rgba(0,0,0,0.55);
      display: flex;
      justify-content: center;
      align-items: center;
      cursor: pointer;
      color: white;
      font-size: 28px;
      text-align: center;
      user-select: none;
    }

    #clickOverlay span {
      background: rgba(255,255,255,0.12);
      padding: 18px 32px;
      border-radius: 14px;
      border: 1px solid rgba(255,255,255,0.25);
      backdrop-filter: blur(6px);
    }

    /* Modal de Actualización */
    #updateModal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 200;
      background: rgba(0,0,0,0.85);
      justify-content: center;
      align-items: center;
    }

    .modal-box {
      position: relative;
      background: #111;
      border: 1px solid rgba(255,255,255,0.25);
      border-radius: 16px;
      padding: 28px 32px 24px;
      max-width: 520px;
      width: 90%;
      color: #fff;
      text-align: center;
      box-shadow: 0 0 40px rgba(255,255,255,0.08);
    }

    .modal-box h2 {
      margin: 0 0 16px;
      font-size: 26px;
      font-weight: 700;
    }

    .modal-box p {
      margin: 0 0 20px;
      font-size: 16px;
      line-height: 1.5;
      color: #ddd;
    }

    /* Texto con brillo blanco */
    .glow {
      color: #fff;
      text-shadow:
        0 0 6px #fff,
        0 0 12px #fff,
        0 0 20px rgba(255,255,255,0.7);
      font-weight: 600;
    }

    #updateVideo {
      width: 100%;
      max-height: 280px;
      border-radius: 10px;
      background: #000;
      margin-bottom: 8px;
    }

    /* Botón X para cerrar */
    #closeModal {
      position: absolute;
      top: 12px;
      right: 14px;
      background: transparent;
      border: none;
      color: #fff;
      font-size: 26px;
      cursor: pointer;
      line-height: 1;
      padding: 4px 8px;
      border-radius: 6px;
      transition: background 0.2s;
    }

    #closeModal:hover {
      background: rgba(255,255,255,0.15);
    }

    /* Main content (hidden until modal closes) */
    #mainContent {
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      width: 100%;
    }

    .container {
      position: relative;
      width: 400px;
      height: 400px;
    }

    .center {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 200px;
      cursor: pointer;
    }

    .hand-left, .hand-right {
      position: absolute;
      width: 100px;
      transition: transform 0.46s cubic-bezier(0.25, 1, 0.5, 1);
    }

    .hand-left {
      bottom: 0;
      left: 0;
      transform: scaleX(-1);
    }

    .hand-right {
      bottom: 0;
      right: 0;
    }

    .audio-ctrl {
      margin-top: 20px;
      display: flex;
      gap: 12px;
      align-items: center;
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.2);
      border-radius: 10px;
      padding: 8px 12px;
      color: #fff;
      flex-wrap: wrap;
      justify-content: center;
    }

    .btn {
      all: unset;
      cursor: pointer;
      padding: 6px 10px;
      border-radius: 8px;
      background: #333;
      color: #fff;
      border: 1px solid rgba(255,255,255,0.2);
    }

    .btn:hover {
      background: #555;
    }

    .hint {
      opacity: 0.7;
      font-size: 12px;
    }
  </style>
</head>
<body>

  <!-- Intro video -->
  <video id="introVideo" src="intro.mp4" playsinline></video>

  <!-- Overlay: haz clic para activar el audio -->
  <div id="clickOverlay">
    <span>▶ Haz clic para empezar</span>
  </div>

  <!-- Modal de Actualización -->
  <div id="updateModal">
    <div class="modal-box">
      <button id="closeModal">×</button>
      <h2>¡Actualización!</h2>
      <p>
        Esta <span class="glow">update</span> se debe porque el <span class="glow">67</span> daba miedo y asustó a un <span class="glow">streamer</span> por la imagen antigua. Aquí el video. <span class="glow">Gracias.</span>
      </p>
      <video id="updateVideo" src="Bixs.mp4" controls playsinline></video>
    </div>
  </div>

  <!-- Main content -->
  <div id="mainContent">
    <div class="container">
      <img src="sixeven2.png" alt="SixEven" class="center" id="sixEven">
      <img src="67 mano.png" alt="Mano Izquierda" class="hand-left" id="handLeft">
      <img src="67 mano.png" alt="Mano Derecha" class="hand-right" id="handRight">
    </div>

    <audio id="audio67" src="67.wav" loop></audio>
    <audio id="audioSixSeven" src="SIX SEVEN.mp3"></audio>

    <div class="audio-ctrl">
      <button class="btn" id="playPause">Reproducir</button>
      <button class="btn" id="oldBtn">67 OLD</button>
      <label>
        Volumen
        <input id="volume" type="range" min="0" max="1" step="0.01" value="0.8"/>
      </label>
      <span class="hint">Si el navegador bloquea autoplay, usa “Reproducir”.</span>
    </div>
  </div>

  <script>
    const introVideo = document.getElementById('introVideo');
    const clickOverlay = document.getElementById('clickOverlay');
    const updateModal = document.getElementById('updateModal');
    const closeModal = document.getElementById('closeModal');
    const mainContent = document.getElementById('mainContent');
    const audio = document.getElementById('audio67');
    const playBtn = document.getElementById('playPause');
    const oldBtn = document.getElementById('oldBtn');
    const vol = document.getElementById('volume');
    const handLeft = document.getElementById('handLeft');
    const handRight = document.getElementById('handRight');
    const sixEven = document.getElementById('sixEven');
    const audioSixSeven = document.getElementById('audioSixSeven');

    let interval;
    const beatDuration = 60 / 130 * 1000;
    let isOld = false;

    // Al hacer clic → quitar overlay, activar sonido y reproducir el intro
    clickOverlay.addEventListener('click', async () => {
      clickOverlay.style.display = 'none';
      introVideo.muted = false;
      introVideo.currentTime = 0;
      try {
        await introVideo.play();
      } catch (err) {
        console.log('Error al reproducir intro:', err);
      }
    });

    // Cuando termina el intro → mostrar el modal de actualización
    introVideo.addEventListener('ended', () => {
      introVideo.style.display = 'none';
      updateModal.style.display = 'flex';
    });

    // Si el video falla, pasar al modal
    introVideo.addEventListener('error', () => {
      setTimeout(() => {
        introVideo.style.display = 'none';
        clickOverlay.style.display = 'none';
        updateModal.style.display = 'flex';
      }, 400);
    });

    // Cerrar el modal → mostrar el contenido principal
    closeModal.addEventListener('click', () => {
      updateModal.style.display = 'none';
      mainContent.style.display = 'flex';
    });

    // Controles del contenido principal
    playBtn.addEventListener('click', async () => {
      if (audio.paused) {
        audio.currentTime = 0;
        await audio.play();
        playBtn.textContent = 'Pausar';
        startHands();
      } else {
        audio.pause();
        audio.currentTime = 0;
        playBtn.textContent = 'Reproducir';
        stopHands();
      }
    });

    vol.addEventListener('input', (e) => {
      audio.volume = parseFloat(e.target.value);
    });

    sixEven.addEventListener('click', () => {
      audioSixSeven.currentTime = 0;
      audioSixSeven.play();
    });

    // Toggle 67 OLD / 67 NEW
    oldBtn.addEventListener('click', () => {
      if (isOld) {
        sixEven.src = 'sixeven2.png';
        oldBtn.textContent = '67 OLD';
        isOld = false;
      } else {
        sixEven.src = 'sixseven.png';
        oldBtn.textContent = '67 NEW';
        isOld = true;
      }
    });

    function startHands() {
      stopHands();
      let toggle = false;
      interval = setInterval(() => {
        toggle = !toggle;
        if (toggle) {
          handLeft.style.transform = "scaleX(-1) translateY(-40px)";
          handRight.style.transform = "translateY(0)";
        } else {
          handLeft.style.transform = "scaleX(-1) translateY(0)";
          handRight.style.transform = "translateY(-40px)";
        }
      }, beatDuration);
    }

    function stopHands() {
      clearInterval(interval);
      handLeft.style.transform = "scaleX(-1) translateY(0)";
      handRight.style.transform = "translateY(0)";
    }
  </script>
</body>
</html>
